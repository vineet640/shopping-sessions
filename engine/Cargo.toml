[package]
name = "ss"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.2.0"
arrow-schema = "60.2.0"
libc = "0.2.191"
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.2.0", default-features = false, features = ["arrow"] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
